name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov moto boto3 openapi-spec-validator jsonschema aws-lambda-powertools

      - name: Run Ruff Format & Lint Checks
        run: |
          ruff format --check backend/
          ruff check backend/

      - name: Run Pytest with Coverage
        run: |
          pytest backend/tests/ -c backend/pyproject.toml --cov=backend/common --cov-report=term-missing --cov-fail-under=80

  trainer:
    name: Trainer Tests & Container Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "trainer/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest moto boto3 scikit-learn xgboost pandas numpy joblib

      - name: Run Ruff Format & Lint Checks
        run: |
          ruff format --check trainer/
          ruff check trainer/

      - name: Run Trainer Tests
        run: |
          pytest trainer/tests/ -c trainer/pyproject.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Trainer Container Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: trainer/Dockerfile
          push: false
          tags: cloudtrain-trainer:test

  frontend:
    name: Frontend Typecheck, Lint & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

  infra:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infra/

      - name: Validate Bootstrap Stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Main Stack
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  openapi:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OpenAPI 3.0 Specification
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator docs/openapi.yaml

  plan:
    name: Terraform Plan (PRs)
    needs: [backend, trainer, frontend, infra, openapi]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=cloudtrain/prod/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}"
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_summary.txt

      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        if: steps.plan.outcome == 'success'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('infra/plan_summary.txt')) {
              const plan = fs.readFileSync('infra/plan_summary.txt', 'utf8').slice(0, 60000);
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 📋 CloudTrain Terraform Plan Summary\n\`\`\`terraform\n${plan}\n\`\`\``
              });
            }
