version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: cloudtrain-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sqs,logs,iam
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  init-aws:
    image: amazon/aws-cli:latest
    container_name: cloudtrain-init-aws
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Creating S3 bucket..."
        aws --endpoint-url=http://localstack:4566 s3 mb s3://cloudtrain-local-data || true

        echo "Creating SQS queues..."
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name cloudtrain-local-jobs || true
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name cloudtrain-local-jobs-dlq || true
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name cloudtrain-local-status || true
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name cloudtrain-local-status-dlq || true

        echo "Creating DynamoDB datasets table..."
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name cloudtrain-local-datasets \
          --attribute-definitions \
            AttributeName=dataset_id,AttributeType=S \
            AttributeName=user_id,AttributeType=S \
            AttributeName=created_at,AttributeType=S \
          --key-schema AttributeName=dataset_id,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName":"user-created-index","KeySchema":[{"AttributeName":"user_id","KeyType":"HASH"},{"AttributeName":"created_at","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST || true

        echo "Creating DynamoDB jobs table..."
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name cloudtrain-local-jobs \
          --attribute-definitions \
            AttributeName=job_id,AttributeType=S \
            AttributeName=user_id,AttributeType=S \
            AttributeName=created_at,AttributeType=S \
            AttributeName=status,AttributeType=S \
            AttributeName=updated_at,AttributeType=S \
          --key-schema AttributeName=job_id,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName":"user-created-index","KeySchema":[{"AttributeName":"user_id","KeyType":"HASH"},{"AttributeName":"created_at","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"status-updated-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"},{"AttributeName":"updated_at","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST || true

        echo "Initializing DynamoDB capacity counter..."
        aws --endpoint-url=http://localstack:4566 dynamodb put-item \
          --table-name cloudtrain-local-jobs \
          --item '{"job_id":{"S":"__capacity__"},"in_use":{"N":"0"}}' || true

        echo "LocalStack AWS resources successfully provisioned!"

volumes:
  localstack-data:
