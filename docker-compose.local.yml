services:
  emulator:
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    image: cloudtrain-local-api:latest
    command: ["moto_server", "-H", "0.0.0.0", "-p", "4566"]
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    image: cloudtrain-trainer:latest
    entrypoint: ["python", "-c", "print('Trainer image ready')"]

  backend:
    image: cloudtrain-local-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    depends_on:
      emulator:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    environment:
      ENV: local
      LOCAL_AUTH_BYPASS: "1"
      COMPUTE_BACKEND: local
      LOCAL_REQUIRE_DOCKER: "1"
      LOCAL_DOCKER_NETWORK: cloudtrain-local
      AWS_ENDPOINT_URL: http://emulator:4566
      S3_ENDPOINT_URL: http://emulator:4566
      DDB_ENDPOINT_URL: http://emulator:4566
      SQS_ENDPOINT_URL: http://emulator:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_REGION: ap-south-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/models')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: cloudtrain-local
