[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "api*", "dataset_profiler*", "job_launcher*", "status_updater*", "dlq_reaper*", "watchdog*", "pre_signup*"]

[project]
name = "cloudtrain-backend"
version = "0.1.0"
description = "CloudTrain backend Lambda functions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "aws-lambda-powertools>=3.0.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,sqs,dynamodb,ec2]>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.12",
    "boto3-stubs[s3,sqs,dynamodb,ec2,logs]>=1.35.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["moto", "moto.*", "boto3.*", "botocore.*", "aws_lambda_powertools.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
